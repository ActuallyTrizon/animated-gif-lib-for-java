name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn compile

    - name: Zip compiled classes
      run: |
        cd target/classes
        zip -r ../../classes.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: classes
        path: classes.zip
        retention-days: 7